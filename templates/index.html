<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Practice</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
        }
        h1 {
            margin-bottom: 40px;
            color: #333;
        }
        .button {
            background-color: #4CAF50;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049;
        }
        .translate-btn {
            background-color: #2196F3;
        }
        .translate-btn:hover {
            background-color: #0b7dda;
        }
      </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Language Practice</h1>
        <a href="/chat" class="button">Chat Practice</a>
        <a href="/translate" class="button translate-btn">Translate Tool</a>
    </div>
</body>
</html>
